# Optional: HTTP to HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nebula-http-redirect
  labels:
    app: nebula
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`nebula.example.com`)  # Change to your domain
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: nebula
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  labels:
    app: nebula
spec:
  redirectScheme:
    scheme: https
    permanent: true
