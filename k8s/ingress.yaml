apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nebula
  labels:
    app: nebula
  annotations:
    # Uncomment and adjust based on your ingress controller
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: nebula.example.com  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nebula
                port:
                  number: 80
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - nebula.example.com
  #     secretName: nebula-tls
