apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nebula-secrets
  labels:
    app: nebula
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store    # Change to your ClusterSecretStore name
    kind: ClusterSecretStore
  target:
    name: nebula-secrets          # K8s secret that will be created
    creationPolicy: Owner
  data:
    # Map external secret keys to environment variables
    # Adjust paths/keys based on your secret store structure

    # Example for AWS Secrets Manager / Vault / etc.
    - secretKey: NEBULA_RGW_1_NAME
      remoteRef:
        key: nebula/rgw-1          # Path in secret store
        property: name             # Property within the secret

    - secretKey: NEBULA_RGW_1_ENDPOINT
      remoteRef:
        key: nebula/rgw-1
        property: endpoint

    - secretKey: NEBULA_RGW_1_ACCESS_KEY
      remoteRef:
        key: nebula/rgw-1
        property: access_key

    - secretKey: NEBULA_RGW_1_SECRET_KEY
      remoteRef:
        key: nebula/rgw-1
        property: secret_key

    - secretKey: NEBULA_RGW_1_REGION
      remoteRef:
        key: nebula/rgw-1
        property: region

    - secretKey: NEBULA_RGW_1_PROXY
      remoteRef:
        key: nebula/rgw-1
        property: proxy
